name: beachprotect
description: "Group phone and speaker theft protection for the beach."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Runtime permission requests (Bluetooth, notifications, camera).
  permission_handler: ^12.0.0

  # Renders the group code as a QR. Pure Dart, no native dependency.
  qr_flutter: ^4.1.0

  # Reads the group QR when joining. Pulls in ML Kit barcode scanning.
  mobile_scanner: ^7.0.0

  # Simple app-wide state propagation for the guard snapshot stream.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
